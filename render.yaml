# Render.com blueprint: one web app (Docker) + one PostgreSQL database, both on the free plan.
databases:
  - name: sepa-trader-db
    plan: free
    databaseName: sepa
    user: sepa

services:
  - type: web
    name: sepa-trader
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sepa-trader-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false # Render asks for this during setup: enter your email
      - key: DATA_PROVIDER
        value: yfinance
      - key: UNIVERSE
        value: sp500 # "core" = only 38 symbols, lighter for the free instance
