# Render.com blueprint: one web app (Docker) + one PostgreSQL database, both on the free plan.
databases:
  - name: sepa-trader-db
    plan: free
    databaseName: sepa
    user: sepa

services:
  - type: web
    name: sepa-trader
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sepa-trader-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false # Render asks for this during setup: enter your email
      - key: DATA_PROVIDER
        value: yfinance
      - key: UNIVERSE
        value: sp500+r1000 # S&P 500 + Nasdaq-100 + theme lists + the largest other Russell 1000 stocks (~800 in all).
        # Lighter: "sp500+" (~560) or "core" (built-in symbols only).
      - key: VNICORN_TRAIN_STOCKS
        value: "0" # vnicornAI learns from this many of the most liquid stocks (0 = all)
      - key: VNICORN_SAMPLES
        value: "3000" # upper bound; training uses fewer samples automatically when memory is short
      - key: UNIVERSE_EXTRA
        value: "300" # extra Russell 1000 stocks with sp500+r1000; lower it (e.g. 150) if the free server runs short of memory
